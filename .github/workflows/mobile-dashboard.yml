name: Mobile dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore evidence checkpoint cache
        uses: actions/cache@v4
        with:
          path: .cache/rwa-evidence
          key: rwa-evidence-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            rwa-evidence-${{ runner.os }}-
      - name: Install external dashboard dependencies
        run: npm ci --ignore-scripts
      - uses: actions/configure-pages@v5
      - name: Build mobile dashboard
        run: node scripts/build-mobile-dashboard.mjs
      - name: Verify GitHub Pages artifact
        run: node scripts/verify-pages-artifact.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Top 3 rendering contract
        run: npm run test:e2e:mobile-dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
