name: LP Oracle Bootstrap Queue

# Temporary activation shim: GitHub only runs issue-event workflows that exist
# on the default branch. This workflow keeps PR #1 unmerged while executing
# the reviewed Oracle implementation from feat/lp-oracle-v3-cloud.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: lp-oracle-bootstrap-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.actor == 'fengxiong111' &&
      startsWith(github.event.issue.title, '[LP_ORACLE] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out LP Oracle implementation
        uses: actions/checkout@v4
        with:
          ref: feat/lp-oracle-v3-cloud
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Analyze and comment on issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/lp-oracle-issue-runner.ts
